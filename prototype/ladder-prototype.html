<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers ticket 05 "Ladder Visual & Motion":
  three structurally different ladders on live Hyperliquid data, switchable
  via ?variant=A|B|C. Also ?coin=BTC ?fps=60|30|update ?sig=5 ?mant=5
  Open the file directly in a browser. Nothing here is production code.
-->
<html lang="en"><head><meta charset="utf-8"><title>ladder prototype</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e11;color:#e5e7eb;font:12px/1.3 ui-monospace,Menlo,monospace;overflow:hidden}
  canvas{display:block;position:absolute;inset:0}
  #bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:6px 10px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 18px #0009;z-index:9;font-weight:600}
  #bar button{background:#111;color:#fff;border:0;border-radius:999px;width:26px;height:26px;cursor:pointer}
  #bar select{border:1px solid #ccc;border-radius:6px;padding:2px 4px;font:inherit}
  #hud{position:fixed;left:10px;bottom:10px;background:#000a;padding:8px 10px;border-radius:6px;white-space:pre;color:#9ca3af;font-size:11px;z-index:8}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="bar"><button id="prev">←</button><span id="label"></span><button id="next">→</button>
  <select id="fps"><option value="60">60 fps</option><option value="30">30 fps</option><option value="update">on-update</option></select>
  <select id="sig"><option value="">full</option><option value="5">5</option><option value="5x2">5×2</option><option value="5x5">5×5</option><option value="4">4</option><option value="3">3</option></select>
</div>
<script>
// ───────────── params / switcher ─────────────
const P = new URLSearchParams(location.search);
const VARIANTS = { A: 'Classic ladder', B: 'Centre spine', C: 'Time trails' };
const KEYS = Object.keys(VARIANTS);
let variant = KEYS.includes(P.get('variant')) ? P.get('variant') : 'A';
const coin = P.get('coin') || 'BTC';
let fpsMode = P.get('fps') || '60';
let sigSel = P.get('sig') || '';
const setParam = (k, v) => { const u = new URL(location); v ? u.searchParams.set(k, v) : u.searchParams.delete(k); history.replaceState(null, '', u); };
const cycle = d => { variant = KEYS[(KEYS.indexOf(variant) + d + KEYS.length) % KEYS.length]; setParam('variant', variant); label.textContent = `${variant} (${VARIANTS[variant]})`; };
prev.onclick = () => cycle(-1); next.onclick = () => cycle(1);
addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
label.textContent = `${variant} (${VARIANTS[variant]})`;
fps.value = fpsMode; fps.onchange = () => { fpsMode = fps.value; setParam('fps', fpsMode); };
sig.value = sigSel; sig.onchange = () => { sigSel = sig.value; setParam('sig', sigSel); resubscribe(); };

// ───────────── palette ─────────────
const C = { bg: '#0b0e11', grid: '#1b2129', text: '#e5e7eb', dim: '#6b7280', bid: [45, 212, 191], ask: [251, 113, 133], hot: [251, 191, 36], mid: [96, 165, 250] };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ───────────── minimal engine (floats; throwaway) ─────────────
const book = { bid: new Map(), ask: new Map() };          // px -> {sz, n}
const hist = new Map();                                   // "bid:px" -> record
const recent = [];                                        // trades (non-historical)
const ev = [];                                            // lifecycle ring for HUD
const stat = { slow: 0, fast: 0, bbo: 0, trades: 0, lastSlow: 0, lastFast: 0, state: 'CONNECTING', events: 0, resync: 0 };
let version = 0, szDecimals = 5, rawTick = 0.1, gridTick = 1, firstTrades = true;
const key = (s, px) => s + ':' + px;
const now = () => performance.now();

function rec(s, px) { let r = hist.get(key(s, px)); if (!r) { r = { side: s, px, firstSeen: now(), lastChanged: now(), size: 0, shown: new Spring(0), prev: 0, consumed: 0, cancelled: 0, pulses: [], trail: [] }; hist.set(key(s, px), r); } return r; }
function pulse(r, type, amt) { r.pulses.push({ type, t0: now(), amt }); if (r.pulses.length > 6) r.pulses.shift(); stat.events++; ev.push(type); if (ev.length > 200) ev.shift(); }

function tradesAt(side, px, t0, t1) { // taker side 'B' buys -> hits asks
  let v = 0; for (const t of recent) if (t.px === px && t.rx > t0 && t.rx <= t1 && ((side === 'ask') === (t.side === 'B'))) v += t.sz; return v;
}

function applyLevels(side, levels, stream, t) {
  const m = book[side], prevT = stream === 'fast' ? stat.lastFast : stat.lastSlow;
  const incoming = new Map(levels.map(l => [+l.px, { sz: +l.sz, n: l.n }]));
  let lo = Infinity, hi = -Infinity; for (const px of incoming.keys()) { lo = Math.min(lo, px); hi = Math.max(hi, px); }
  for (const [px, cur] of m) {
    const inWindow = stream === 'slow' || (px >= lo && px <= hi);
    if (!inWindow) continue;
    const nx = incoming.get(px);
    if (!nx) { const r = rec(side, px); r.prev = cur.sz; r.size = 0; r.shown.target = 0; r.lastChanged = t;
      const c = Math.min(cur.sz, tradesAt(side, px, prevT, t)); r.consumed += c; r.cancelled += cur.sz - c; pulse(r, c > 0 ? 'consumed' : 'vanished', cur.sz); m.delete(px); }
    else if (nx.sz < cur.sz) { const r = rec(side, px); r.prev = cur.sz; r.size = nx.sz; r.shown.target = nx.sz; r.lastChanged = t;
      const d = cur.sz - nx.sz, c = Math.min(d, tradesAt(side, px, prevT, t)); r.consumed += c; r.cancelled += d - c; pulse(r, c > 0 ? 'consumed' : 'shrank', d); m.set(px, nx); }
    else if (nx.sz > cur.sz) { const r = rec(side, px); r.prev = cur.sz; r.size = nx.sz; r.shown.target = nx.sz; r.lastChanged = t; pulse(r, 'grew', nx.sz - cur.sz); m.set(px, nx); }
  }
  for (const [px, nx] of incoming) if (!m.has(px)) { const r = rec(side, px); if (r.size === 0 && r.shown.x < 1e-9) { r.firstSeen = t; } r.size = nx.sz; r.shown.target = nx.sz; r.lastChanged = t; pulse(r, 'added', nx.sz); m.set(px, nx); }
  version++;
}

function applyBook(d, t) {
  const stream = d.fast ? 'fast' : 'slow';
  applyLevels('bid', d.levels[0], stream, t); applyLevels('ask', d.levels[1], stream, t);
  if (stream === 'fast') { stat.fast++; stat.lastFast = t; } else { stat.slow++; stat.lastSlow = t; }
  const b = best('bid'), a = best('ask'); if (b && a) gridTick = inferGrid(d.levels);
  stat.state = 'LIVE';
}
function applyBbo(d, t) {
  stat.bbo++; const [b, a] = d.bbo;
  if (b) { for (const px of [...book.bid.keys()]) if (px > +b.px) book.bid.delete(px); const cur = book.bid.get(+b.px); if (!cur || cur.sz !== +b.sz) applyLevels('bid', [b], 'fast', t); }
  if (a) { for (const px of [...book.ask.keys()]) if (px < +a.px) book.ask.delete(px); const cur = book.ask.get(+a.px); if (!cur || cur.sz !== +a.sz) applyLevels('ask', [a], 'fast', t); }
}
function applyTrades(arr, t) {
  if (firstTrades) { firstTrades = false; return; }              // historical batch
  for (const x of arr) { recent.push({ px: +x.px, sz: +x.sz, side: x.side, rx: t }); stat.trades++;
    const side = x.side === 'B' ? 'ask' : 'bid'; const r = rec(side, +x.px); pulse(r, 'fill', +x.sz); }
  while (recent.length && recent[0].rx < t - 15000) recent.shift();
}
const best = s => { let b; for (const px of book[s].keys()) b = b === undefined ? px : (s === 'bid' ? Math.max(b, px) : Math.min(b, px)); return b; };
function inferGrid(levels) { let d = Infinity; for (const side of levels) { const p = side.map(l => +l.px).sort((a, b) => a - b); for (let i = 1; i < p.length; i++) d = Math.min(d, +(p[i] - p[i - 1]).toFixed(8)); } return isFinite(d) ? d : gridTick; }

// ───────────── feed ─────────────
let ws, subs = [];
function subObj(fast) { const o = { type: 'l2Book', coin, fast }; if (sigSel) { const [n, m] = sigSel.split('x'); o.nSigFigs = +n; if (m) o.mantissa = +m; } return o; }
function resubscribe() {
  if (!ws || ws.readyState !== 1) return;
  for (const s of subs) ws.send(JSON.stringify({ method: 'unsubscribe', subscription: s }));
  book.bid.clear(); book.ask.clear(); hist.clear(); stat.state = 'RESYNCING'; stat.resync++; version++;
  subs = [subObj(false), subObj(true)]; for (const s of subs) ws.send(JSON.stringify({ method: 'subscribe', subscription: s }));
}
function connect() {
  ws = new WebSocket('wss://api.hyperliquid.xyz/ws'); stat.state = 'CONNECTING';
  ws.onopen = () => { stat.state = 'SUBSCRIBING'; subs = [subObj(false), subObj(true)];
    for (const s of [...subs, { type: 'bbo', coin }, { type: 'trades', coin }]) ws.send(JSON.stringify({ method: 'subscribe', subscription: s }));
    setInterval(() => ws.readyState === 1 && ws.send('{"method":"ping"}'), 50000); };
  ws.onmessage = e => { const m = JSON.parse(e.data), t = now();
    if (m.channel === 'l2Book') applyBook(m.data, t); else if (m.channel === 'bbo') applyBbo(m.data, t); else if (m.channel === 'trades') applyTrades(m.data, t); };
  ws.onclose = () => { stat.state = 'DISCONNECTED'; setTimeout(connect, 1500); };
}
fetch('https://api.hyperliquid.xyz/info', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type: 'meta' }) })
  .then(r => r.json()).then(m => { const u = m.universe.find(x => x.name === coin); if (u) { szDecimals = u.szDecimals; rawTick = Math.pow(10, -(6 - szDecimals)); } }).catch(() => {}).finally(connect);

// ───────────── animation primitives ─────────────
function Spring(x, k = 180, c = 24) { this.x = x; this.v = 0; this.target = x; this.k = k; this.c = c; }
Spring.prototype.step = function (dt) { const a = this.k * (this.target - this.x) - this.c * this.v; this.v += a * dt; this.x += this.v * dt; if (Math.abs(this.x - this.target) < 1e-6 && Math.abs(this.v) < 1e-6) { this.x = this.target; this.v = 0; } return this.x; };
const decay = (age, tau) => Math.exp(-age / tau);
const anchor = new Spring(0, 40, 13);          // ladder centre price, slow re-centre
let anchorInit = false;

// ───────────── shared presentation sampling ─────────────
function sample(dt) {
  const t = now(), b = best('bid'), a = best('ask'); if (b === undefined || a === undefined) return null;
  const mid = (b + a) / 2;
  if (!anchorInit) { anchor.x = anchor.target = mid; anchorInit = true; }
  const rows = Math.floor(innerHeight / ROW), half = Math.floor(rows / 2);
  if (Math.abs(mid - anchor.target) > gridTick * half * 0.3) anchor.target = mid;
  const centre = anchor.step(dt);
  const rowsOut = [];
  let maxSz = 0, cumB = 0, cumA = 0;
  for (const r of hist.values()) { r.shown.step(dt); r.pulses = r.pulses.filter(p => t - p.t0 < 1500); if (r.size === 0 && t - r.lastChanged > 60000 && !r.pulses.length) hist.delete(key(r.side, r.px)); }
  for (let i = 0; i < rows; i++) {
    const px = +(Math.round(centre / gridTick) * gridTick + (half - i) * gridTick).toFixed(8);
    const side = px >= a ? 'ask' : px <= b ? 'bid' : 'spread';
    const r = side === 'spread' ? null : hist.get(key(side, px));
    rowsOut.push({ i, px, side, r, shown: r ? r.shown.x : 0, live: r ? r.size : 0 });
  }
  // ruler: 12 rows from mid; normalise heat to max inside ruler
  const RULER = 12, midRow = rowsOut.findIndex(x => x.px < a) - 0.5;
  for (const x of rowsOut) { x.inRuler = Math.abs(x.i - midRow) <= RULER; if (x.inRuler) maxSz = Math.max(maxSz, x.shown); }
  for (const x of rowsOut) if (x.side === 'bid') { cumB += x.shown; x.cum = cumB; }
  for (const x of rowsOut) if (x.side === 'ask') { cumA += x.shown; x.cum = cumA; }
  let maxCum = 0; for (const x of rowsOut) if (x.inRuler && x.cum) maxCum = Math.max(maxCum, x.cum);
  const bb = book.bid.get(b), aa = book.ask.get(a);
  const imb = bb && aa ? (bb.sz - aa.sz) / (bb.sz + aa.sz) : 0;
  const micro = bb && aa ? (b * aa.sz + a * bb.sz) / (aa.sz + bb.sz) : mid;
  for (const x of rowsOut) x.empty = !x.r || (x.shown < 1e-6 && !x.r.pulses.length);
  return { t, rows: rowsOut, mid, micro, b, a, imb, maxSz: maxSz || 1, maxCum: maxCum || 1, midRow, RULER, centre };
}
const ROW = 22;
// mid ribbon drawn at the bid/ask boundary regardless of whether a spread row exists
function ribbon(S, x0, x1, labelX, align) {
  const y = Math.round((S.midRow + 0.5) * ROW); const pos = (S.micro - S.b) / (S.a - S.b);
  ctx.fillStyle = rgba(C.mid, 0.55); ctx.fillRect(x0, y - 1, x1 - x0, 2);
  ctx.fillStyle = rgba(C.mid, 1); ctx.fillRect(x0 + pos * (x1 - x0) - 2, y - 5, 4, 10);            // microprice marker
  const imbW = 60; ctx.fillStyle = rgba(S.imb > 0 ? C.bid : C.ask, 0.8); ctx.fillRect(x1 + 8 + (S.imb < 0 ? imbW * (1 + S.imb) / 2 : imbW / 2), y - 3, Math.abs(S.imb) * imbW / 2, 6); ctx.fillStyle = '#ffffff30'; ctx.fillRect(x1 + 8 + imbW / 2, y - 5, 1, 10);
  text(`mid ${fmtPx(S.mid)}  ·  spread ${(S.a - S.b).toFixed(Math.max(1, -Math.floor(Math.log10(gridTick))))}  ·  micro ${S.micro.toFixed(2)}  ·  imb ${(S.imb * 100).toFixed(0)}%`, labelX, y + (S.imb >= 0 ? -ROW / 2 - 1 : ROW / 2 + 1), rgba(C.mid, 0.95), align, 11, true);
}

// ───────────── drawing helpers ─────────────
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { desynchronized: true });
function resize() { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px"; ctx.setTransform(d, 0, 0, d, 0, 0); } addEventListener('resize', resize); resize();
const fmtPx = px => px.toFixed(Math.max(0, -Math.floor(Math.log10(gridTick) + 1e-9)));
const fmtSz = sz => sz >= 1000 ? (sz / 1000).toFixed(1) + 'k' : sz.toFixed(sz < 10 ? 3 : 1);
const sideC = s => s === 'bid' ? C.bid : C.ask;
const persistence = r => r ? Math.min(1, (now() - r.firstSeen) / 20000) : 0;           // 0..1 over 20 s
function pulseState(r) { // returns {flash, ghost, fill, add} intensities
  const o = { flash: 0, ghost: 0, fill: 0, add: 0 }; if (!r) return o; const t = now();
  for (const p of r.pulses) { const age = t - p.t0;
    if (p.type === 'fill' || p.type === 'consumed') o.fill = Math.max(o.fill, decay(age, 500));
    else if (p.type === 'vanished' || p.type === 'shrank') o.ghost = Math.max(o.ghost, decay(age, 700));
    else if (p.type === 'added') o.add = Math.max(o.add, decay(age, 450));
    else if (p.type === 'grew') o.flash = Math.max(o.flash, decay(age, 400)); }
  return o;
}
function heatColour(row, S) { const c = sideC(row.side), sat = 0.35 + 0.65 * persistence(row.r), rel = row.shown / S.maxSz;
  const hot = rel > 0.85 ? (rel - 0.85) / 0.15 : 0; const cc = hot ? c.map((v, i) => v + (C.hot[i] - v) * hot) : c;
  return { c: cc, a: (0.15 + 0.85 * Math.pow(rel, 0.7)) * sat }; }
function text(s, x, y, col, align = 'left', size = 12, bold = false) { ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.font = `${bold ? '600 ' : ''}${size}px ui-monospace,Menlo,monospace`; ctx.fillText(s, x, y); }
const isRound = px => Math.abs(px / (gridTick * 10) - Math.round(px / (gridTick * 10))) < 1e-9;

// ───────────── Variant A: classic ladder ─────────────
function drawA(S) {
  const W = innerWidth, X = { px: 90, heat: 110, sz: 200, blk: 230 }, blkW = Math.min(360, W - 300);
  // depth profile (stair-step), behind
  for (const side of ['ask', 'bid']) { const c = sideC(side); ctx.beginPath(); let started = false;
    for (const row of S.rows) { if (row.side !== side) continue; const y = row.i * ROW, w = X.blk + (row.cum / S.maxCum) * blkW;
      if (!started) { ctx.moveTo(X.blk, y); started = true; } ctx.lineTo(w, y); ctx.lineTo(w, y + ROW); }
    ctx.lineTo(X.blk, side === 'ask' ? (S.midRow + 0.5) * ROW : innerHeight); ctx.closePath();
    const g = ctx.createLinearGradient(X.blk, 0, X.blk + blkW, 0); g.addColorStop(0, rgba(c, 0.18)); g.addColorStop(1, rgba(c, 0.03)); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = rgba(c, 0.5); ctx.lineWidth = 1; ctx.stroke(); }
  for (const row of S.rows) { const y = row.i * ROW, cy = y + ROW / 2, c = row.side === 'spread' ? C.mid : sideC(row.side), dim = row.inRuler ? 1 : 0.45;
    if (row.side === 'spread') { ctx.fillStyle = rgba(C.mid, 0.06); ctx.fillRect(0, y, W, ROW); continue; }
    if (row.empty) { text(fmtPx(row.px), X.px, cy, isRound(row.px) ? C.text : C.dim, 'right', 12, isRound(row.px)); continue; }
    const ps = pulseState(row.r), h = heatColour(row, S);
    ctx.globalAlpha = dim;
    // heat cell
    ctx.fillStyle = rgba(h.c, h.a); ctx.fillRect(X.heat, y + 2, 14, ROW - 4);
    // order block
    const w = (row.shown / S.maxSz) * blkW; ctx.fillStyle = rgba(h.c, 0.22 + 0.5 * persistence(row.r)); ctx.fillRect(X.blk, y + 3, w, ROW - 6);
    if (ps.ghost) { ctx.fillStyle = rgba(c, 0.25 * ps.ghost); ctx.fillRect(X.blk + w, y + 3, Math.max(0, ((row.r.prev - row.live) / S.maxSz) * blkW), ROW - 6); }
    if (ps.add) { ctx.strokeStyle = rgba([255, 255, 255], 0.8 * ps.add); ctx.lineWidth = 1; ctx.strokeRect(X.blk + 0.5, y + 3.5, Math.max(w, 2), ROW - 7); }
    if (ps.fill) { ctx.fillStyle = rgba([255, 255, 255], 0.55 * ps.fill); ctx.fillRect(X.heat - 6, y + 2, 4, ROW - 4); ctx.fillStyle = rgba(C.hot, 0.35 * ps.fill); ctx.fillRect(0, y, W, ROW); }
    if (ps.flash) { ctx.fillStyle = rgba(c, 0.12 * ps.flash); ctx.fillRect(X.blk, y, blkW, ROW); }
    text(fmtPx(row.px), X.px, cy, isRound(row.px) ? C.text : rgba(c, 0.9), 'right', 12, isRound(row.px));
    text(fmtSz(row.shown), X.sz, cy, C.text, 'right'); if (row.r && row.live) text('·'.repeat(Math.min(6, book[row.side].get(row.px)?.n || 0)), X.sz + 6, cy, rgba(c, 0.6));
    ctx.globalAlpha = 1;
  }
  // ruler
  for (const s of [-1, 1]) { const y = Math.round((S.midRow + 0.5 + s * S.RULER) * ROW); ctx.fillStyle = '#ffffff30'; ctx.fillRect(0, y, W, 1);
    const cumRow = S.rows.find(r => Math.abs(r.i - (S.midRow + 0.5 + s * S.RULER - (s > 0 ? 1 : 0))) < 0.6); if (cumRow?.cum) text(`Σ ${fmtSz(cumRow.cum)}`, X.blk + blkW + 8, y + (s > 0 ? -8 : 8), C.dim); }
  ribbon(S, X.blk, X.blk + 80, X.blk + 160, 'left');
}

// ───────────── Variant B: centre spine ─────────────
function drawB(S) {
  const W = innerWidth, cx = Math.round(W / 2), half = Math.min(420, cx - 60);
  // mirrored profile
  for (const side of ['ask', 'bid']) { const c = sideC(side), dir = side === 'bid' ? -1 : 1; ctx.beginPath(); let first = true;
    for (const row of S.rows) { if (row.side !== side) continue; const y = row.i * ROW, w = cx + dir * (60 + (row.cum / S.maxCum) * (half - 60));
      if (first) { ctx.moveTo(cx + dir * 60, y); first = false; } ctx.lineTo(w, y); ctx.lineTo(w, y + ROW); }
    ctx.lineTo(cx + dir * 60, side === 'ask' ? (S.midRow + 0.5) * ROW : innerHeight); ctx.closePath();
    ctx.fillStyle = rgba(c, 0.07); ctx.fill(); ctx.strokeStyle = rgba(c, 0.45); ctx.stroke(); }
  for (const row of S.rows) { const y = row.i * ROW, cy = y + ROW / 2, dim = row.inRuler ? 1 : 0.45;
    if (row.side === 'spread') { ctx.fillStyle = rgba(C.mid, 0.06); ctx.fillRect(0, y, W, ROW); continue; }
    ctx.globalAlpha = dim; const c = sideC(row.side), dir = row.side === 'bid' ? -1 : 1;
    text(fmtPx(row.px), cx, cy, isRound(row.px) ? C.text : rgba(c, 0.85), 'center', 12, isRound(row.px));
    if (row.empty) { ctx.globalAlpha = 1; continue; }
    const ps = pulseState(row.r), h = heatColour(row, S), w = (row.shown / S.maxSz) * (half - 60), x0 = cx + dir * 60;
    ctx.fillStyle = rgba(h.c, h.a); ctx.fillRect(dir < 0 ? x0 - w : x0, y + 3, w, ROW - 6);
    if (ps.ghost) { const gw = ((row.r.prev - row.live) / S.maxSz) * (half - 60); ctx.fillStyle = rgba(c, 0.2 * ps.ghost); ctx.fillRect(dir < 0 ? x0 - w - gw : x0 + w, y + 3, gw, ROW - 6); }
    if (ps.add) { ctx.strokeStyle = rgba([255, 255, 255], 0.8 * ps.add); ctx.strokeRect((dir < 0 ? x0 - w : x0) + 0.5, y + 3.5, Math.max(w, 2), ROW - 7); }
    if (ps.fill) { ctx.fillStyle = rgba([255, 255, 255], 0.6 * ps.fill); ctx.fillRect(cx + dir * 52, y + 2, 4, ROW - 4); ctx.fillStyle = rgba(C.hot, 0.3 * ps.fill); ctx.fillRect(dir < 0 ? 0 : cx, y, cx, ROW); }
    text(fmtSz(row.shown), dir < 0 ? x0 - w - 6 : x0 + w + 6, cy, C.text, dir < 0 ? 'right' : 'left', 11);
    ctx.globalAlpha = 1; }
  for (const s of [-1, 1]) { const y = Math.round((S.midRow + 0.5 + s * S.RULER) * ROW); ctx.fillStyle = '#ffffff30'; ctx.fillRect(0, y, W, 1); }
  ribbon(S, cx - 60, cx + 60, cx - 70, 'right');
}

// ───────────── Variant C: time trails ─────────────
const TRAIL_MS = 12000, TRAIL_DT = 250; let lastTrail = 0;
function drawC(S) {
  const W = innerWidth, X = { px: 80, trail0: 100 }, trailW = W - 340, xSz = W - 120, t = S.t;
  if (t - lastTrail > TRAIL_DT) { lastTrail = t; for (const r of hist.values()) { r.trail.push({ t, sz: r.size }); while (r.trail.length && r.trail[0].t < t - TRAIL_MS) r.trail.shift(); } }
  for (const row of S.rows) { const y = row.i * ROW, cy = y + ROW / 2, dim = row.inRuler ? 1 : 0.45;
    if (row.side === 'spread') { ctx.fillStyle = rgba(C.mid, 0.06); ctx.fillRect(0, y, W, ROW); continue; }
    ctx.globalAlpha = dim; const c = sideC(row.side);
    text(fmtPx(row.px), X.px, cy, isRound(row.px) ? C.text : rgba(c, 0.85), 'right', 12, isRound(row.px));
    if (row.empty) { ctx.globalAlpha = 1; continue; }
    const r = row.r, ps = pulseState(r), sat = 0.35 + 0.65 * persistence(r);
    // trail: one cell per sample, x = time, alpha = size / maxSz
    for (const s of r.trail) { const x = X.trail0 + ((s.t - (t - TRAIL_MS)) / TRAIL_MS) * trailW; if (x < X.trail0) continue; const rel = s.sz / S.maxSz; if (rel <= 0) continue;
      ctx.fillStyle = rgba(rel > 0.85 ? C.hot : c, (0.1 + 0.8 * Math.pow(rel, 0.7)) * sat); ctx.fillRect(x, y + 3, Math.max(2, trailW * TRAIL_DT / TRAIL_MS), ROW - 6); }
    // fill markers as dots on the trail
    for (const p of r.pulses) if (p.type === 'fill') { const x = X.trail0 + ((p.t0 - (t - TRAIL_MS)) / TRAIL_MS) * trailW; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, cy, 2.5, 0, 7); ctx.fill(); }
    // current size: bar at right edge + number
    const w = (row.shown / S.maxSz) * 80; ctx.fillStyle = rgba(c, 0.25 + 0.6 * sat); ctx.fillRect(xSz - 90, y + 4, w, ROW - 8);
    if (ps.ghost) { ctx.fillStyle = rgba(c, 0.25 * ps.ghost); ctx.fillRect(xSz - 90 + w, y + 4, ((r.prev - row.live) / S.maxSz) * 80, ROW - 8); }
    if (ps.fill) { ctx.fillStyle = rgba(C.hot, 0.35 * ps.fill); ctx.fillRect(0, y, W, ROW); }
    if (ps.add) { ctx.strokeStyle = rgba([255, 255, 255], 0.8 * ps.add); ctx.strokeRect(xSz - 89.5, y + 4.5, Math.max(w, 2), ROW - 9); }
    text(fmtSz(row.shown), xSz + 50, cy, C.text, 'right'); ctx.globalAlpha = 1; }
  ctx.fillStyle = '#ffffff20'; ctx.fillRect(X.trail0 + trailW, 0, 1, innerHeight); text('now →', X.trail0 + trailW + 4, 10, C.dim, 'left', 10); text('−12 s', X.trail0, 10, C.dim, 'left', 10);
  for (const s of [-1, 1]) { const y = Math.round((S.midRow + 0.5 + s * S.RULER) * ROW); ctx.fillStyle = '#ffffff30'; ctx.fillRect(0, y, W, 1); }
  ribbon(S, xSz - 90, xSz - 10, X.trail0, 'left');
}

// ───────────── frame loop with cadence cap + HUD ─────────────
const frames = []; let lastT = now(), lastDraw = 0, drawn = 0, dropped = 0, lastVersion = -1, fpsShown = 0, lastFpsT = now();
function loop() {
  requestAnimationFrame(loop);
  const t = now(), dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  const anyMotion = [...hist.values()].some(r => r.pulses.length || Math.abs(r.shown.x - r.shown.target) > 1e-6) || Math.abs(anchor.x - anchor.target) > 1e-6;
  const cap = fpsMode === '30' ? 1000 / 30 - 1 : 0;
  if (fpsMode === 'update' && version === lastVersion && !anyMotion) return;
  if (t - lastDraw < cap) return;
  const t0 = now(); const S = sample(dt); lastDraw = t; lastVersion = version;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
  if (S) ({ A: drawA, B: drawB, C: drawC })[variant](S);
  const ft = now() - t0; frames.push(ft); if (frames.length > 120) frames.shift(); drawn++;
  if (t - lastFpsT > 500) { fpsShown = drawn / ((t - lastFpsT) / 1000); drawn = 0; lastFpsT = t;
    const sorted = [...frames].sort((a, b) => a - b), p = q => (sorted[Math.floor(q * (sorted.length - 1))] || 0).toFixed(2);
    const age = x => x ? ((t - x) / 1000).toFixed(1) + 's' : '–';
    const stale = (stat.lastFast && t - stat.lastFast > 3000) || (stat.lastSlow && t - stat.lastSlow > 20000);
    hud.textContent = `MARKET   ${coin} ${sigSel ? 'sig ' + sigSel : 'full'}  grid ${gridTick}  raw ${rawTick}\nstate    ${stale ? 'STALE' : stat.state}   resyncs ${stat.resync}\nslow ${stat.slow}  last ${age(stat.lastSlow)}   fast ${stat.fast}  last ${age(stat.lastFast)}\nbbo ${stat.bbo}   trades ${stat.trades}   events ${stat.events}\nlast events ${ev.slice(-6).join(' ')}\n\nRENDER   mode ${fpsMode}   fps ${fpsShown.toFixed(1)}\nframe p50 ${p(0.5)} ms  p95 ${p(0.95)} ms   hist ${hist.size}`; }
}
loop();
</script></body></html>
