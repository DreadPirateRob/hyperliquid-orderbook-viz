<!doctype html>
<!--
  PROTOTYPE v4 — throwaway. Ticket 17: metric overlays (size-delta tint, resiliency bar, migration trails, sparkline + convexity, cost readout, HUD metrics) on top of v3. ?ovl=0 hides them; key o toggles. v3 was: top bar (pair popover w/ search, tabs, favourites; stats; segmented grouping;
  view/trails/tape/metrics toggles; gear popover; connection dot; pause). Engine/renderer are v2's, unchanged.
  ?coin=BTC ?view=ladder|spine ?trails=1 ?tape=1 ?g=<tick>   (metrics/fps/ruler are localStorage prefs)
  Requires a local server? No: plain file:// works (REST via fetch to api.hyperliquid.xyz is CORS-open).
-->
<html lang="en"><head><meta charset="utf-8"><title>ladder prototype v4</title>
<style>
  :root{--bar:44px;--bg:#0b0e11;--panel:#0f1319;--line:#232b36;--dim:#6b7280;--text:#e5e7eb;--bid:#2dd4bf;--ask:#fb7185;--mid:#60a5fa}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.3 ui-monospace,Menlo,monospace;overflow:hidden}
  #c{display:block;position:absolute;left:0;right:0;top:var(--bar);bottom:0}
  #topbar{position:fixed;top:0;left:0;right:0;height:var(--bar);background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;z-index:9;white-space:nowrap}
  #pair{display:flex;align-items:center;gap:8px;background:#161b22;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:13px}
  #pair .badge{font-size:9px;font-weight:600;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:1px 4px}
  #pair .chev{color:var(--dim);font-size:10px}
  #last{font-size:16px;font-weight:600;min-width:90px}
  .stat{display:flex;flex-direction:column;line-height:1.15}
  .stat b{font-weight:500;font-size:11px}.stat i{font-style:normal;font-size:9px;color:var(--dim)}
  .sep{width:1px;height:24px;background:var(--line)}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--dim);padding:5px 9px;font:inherit;cursor:pointer}
  .seg button.on{background:#1c2430;color:var(--text)}
  .seg button.flash{animation:flash .6s}
  @keyframes flash{from{background:#60a5fa66}to{}}
  .tog{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--dim);padding:5px 9px;font:inherit;cursor:pointer}
  .tog.on{color:var(--text);border-color:#3b4656;background:#1c2430}
  .spacer{flex:1}
  #conn{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;cursor:default}
  #dot{width:8px;height:8px;border-radius:50%;background:#6b7280}
  #dot.LIVE{background:#22c55e}#dot.STALE{background:#f59e0b}#dot.RESYNCING,#dot.CONNECTING,#dot.SUBSCRIBING{background:#60a5fa}#dot.DISCONNECTED{background:#ef4444}
  .pop{position:fixed;top:calc(var(--bar) + 6px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px #000a;z-index:10;display:none}
  .pop.on{display:block}
  #pairpop{left:12px;width:420px;max-height:70vh;display:none;flex-direction:column}
  #pairpop.on{display:flex}
  #pairpop input{margin:10px;background:#0b0e11;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:7px 10px;font:inherit;outline:none}
  #pairpop input:focus{border-color:var(--mid)}
  #tabs{display:flex;gap:2px;padding:0 10px 6px}
  #tabs button{background:transparent;border:0;color:var(--dim);padding:4px 10px;font:inherit;cursor:pointer;border-radius:5px}
  #tabs button.on{background:#1c2430;color:var(--text)}
  #list{overflow:auto;flex:1}
  #list .row{display:grid;grid-template-columns:18px 1fr 110px 80px;gap:8px;align-items:center;padding:6px 10px;cursor:pointer;font-size:12px}
  #list .row:hover,#list .row.sel{background:#161b22}
  #list .row .star{color:#3b4656}.row .star.on{color:#fbbf24}
  #list .hdr{color:var(--dim);font-size:9px;padding:2px 10px;display:grid;grid-template-columns:18px 1fr 110px 80px;gap:8px}
  .up{color:var(--bid)}.dn{color:var(--ask)}.r{text-align:right}
  #gearpop{right:12px;padding:10px 12px;display:none;grid-template-columns:auto auto;gap:8px 14px;align-items:center;font-size:11px;color:var(--dim)}
  #gearpop.on{display:grid}
  #gearpop select,#gearpop input{background:#0b0e11;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:3px 6px;font:inherit}
  #hud{position:static;background:#0f1319ee;border:1px solid var(--line);padding:8px 10px;border-radius:6px;white-space:pre;color:#9ca3af;font-size:11px;display:none;z-index:8}
  #hud.on{display:block}
  #hudwrap{position:fixed;top:calc(var(--bar) + 6px);right:var(--hud-right,12px);z-index:8;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  #hud{position:static}
  #shape{display:none;position:static;width:240px;height:90px;background:#0f1319ee;border:1px solid var(--line);border-radius:6px}
  #shape.on{display:block}
</style></head><body>
<div id="topbar">
  <div id="pair" tabindex="0"><span id="pairname">BTC</span><span class="badge" id="pairtype">PERP</span><span class="chev">▾</span></div>
  <div class="stat"><b id="last" style="font-size:16px">–</b><i>mid</i></div>
  <div class="stat"><b id="s-mark">–</b><i>mark</i></div>
  <div class="stat"><b id="s-chg">–</b><i>24h</i></div>
  <div class="stat"><b id="s-vol">–</b><i>24h vol</i></div>
  <div class="stat"><b id="s-fund">–</b><i>funding</i></div>
  <div class="sep"></div>
  <div class="seg" id="groupseg"></div>
  <div class="sep"></div>
  <div class="seg" id="viewseg"><button data-v="ladder">ladder</button><button data-v="spine">spine</button></div>
  <button class="tog" id="trails">trails</button>

</div>
<div class="pop" id="pairpop">
  <input id="q" placeholder="Search markets   ( / )" autocomplete="off">

  <div id="list"></div>
</div>
<div class="pop" id="gearpop">
  <span>render cadence</span><select id="fps"><option value="60">60 fps</option><option value="30">30 fps</option><option value="update">on-update</option></select>
  <span>ruler distance (rows)</span><input id="ruler" type="number" min="4" max="40" value="12" style="width:60px">
  <span>cost notional ($)</span><select id="notional"><option>10000</option><option selected>100000</option><option>1000000</option></select>
  <span>ribbon</span><select id="ribbon"><option value="1">own row</option><option value="2">edge + pill</option><option value="3">side panel</option></select>
</div>
<div id="hudwrap"><div id="hud"></div><canvas id="shape" width="240" height="90"></canvas></div>
<canvas id="c"></canvas>
<script>
// ───────────── params / prefs / controls ─────────────
const P = new URLSearchParams(location.search);
const setParam = (k, v) => { const u = new URL(location); v ? u.searchParams.set(k, v) : u.searchParams.delete(k); history.replaceState(null, '', u); };
const pref = (k, d) => { try { const v = localStorage.getItem('ob.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const setPref = (k, v) => localStorage.setItem('ob.' + k, JSON.stringify(v));
let coin = P.get('coin') || 'BTC';                   // shareable state → URL
let view = P.get('view') === 'spine' ? 'spine' : 'ladder';
let trailsOn = P.get('trails') !== '0';
let tapeOn = P.get('tape') !== '0';
let groupSel = P.get('g') || '';
let metricsOn = pref('metrics', false);               // preferences → localStorage
let fpsMode = pref('fps', '60');
let ribbonV = pref('ribbon', 1);
let RULER = pref('ruler', 12);
let notional = pref('notional', 100000);
let favs = new Set(pref('favs', []));
let paused = false;
const TAPE_W = 200;
const $ = id => document.getElementById(id);
const setTog = (id, on) => $(id).classList.toggle('on', on);
// view segment
const syncView = () => [...$('viewseg').children].forEach(b => b.classList.toggle('on', b.dataset.v === view));
$('viewseg').onclick = e => { if (e.target.dataset.v) { view = e.target.dataset.v; setParam('view', view === 'ladder' ? '' : view); syncView(); } }; syncView();
// toggles
setTog('trails', trailsOn); $('trails').onclick = () => { trailsOn = !trailsOn; setTog('trails', trailsOn); setParam('trails', trailsOn ? '' : '0'); };
const placeHud = () => $('hudwrap').style.setProperty('--hud-right', (tapeOn ? TAPE_W + 12 : 12) + 'px');
setTog('tape', tapeOn); $('tape').onclick = () => { tapeOn = !tapeOn; setTog('tape', tapeOn); setParam('tape', tapeOn ? '' : '0'); placeHud(); }; placeHud();
setTog('mbtn', metricsOn); $('hud').classList.toggle('on', metricsOn); $('shape').classList.toggle('on', metricsOn);
$('mbtn').onclick = () => { metricsOn = !metricsOn; setTog('mbtn', metricsOn); $('hud').classList.toggle('on', metricsOn); $('shape').classList.toggle('on', metricsOn); setPref('metrics', metricsOn); };
let overlaysOn = P.get('ovl') !== '0', costHover = false;
setTog('ovl', overlaysOn); $('ovl').onclick = () => { overlaysOn = !overlaysOn; setTog('ovl', overlaysOn); setParam('ovl', overlaysOn ? '' : '0'); };
$('pause').onclick = () => { paused = !paused; setTog('pause', paused); $('pause').textContent = paused ? '▶' : '⏸'; $('conntext').textContent = paused ? 'PAUSED' : stat.state; $('dot').className = paused ? 'STALE' : stat.state; };
// gear popover
$('gear').onclick = e => { e.stopPropagation(); $('gearpop').classList.toggle('on'); $('pairpop').classList.remove('on'); };
$('fps').value = fpsMode; $('fps').onchange = e => { fpsMode = e.target.value; setPref('fps', fpsMode); };
$('ribbon').value = ribbonV; $('ribbon').onchange = e => { ribbonV = +e.target.value; setPref('ribbon', ribbonV); };
$('ruler').value = RULER; $('ruler').onchange = e => { RULER = Math.max(4, Math.min(40, +e.target.value || 12)); setPref('ruler', RULER); };
$('notional').value = notional; $('notional').onchange = e => { notional = +e.target.value; setPref('notional', notional); };
// grouping segment
function renderGroupSeg() { $('groupseg').innerHTML = groupOpts.map(o => `<button data-g="${o.tick}" class="${o === activeOpt ? 'on' : ''}">${o.label}</button>`).join(''); }
$('groupseg').onclick = e => { const g = e.target.dataset.g; if (!g) return; groupSel = g; setParam('g', g); applyGrouping(); renderGroupSeg(); };
const stepGroup = d => { const i = groupOpts.indexOf(activeOpt); const n = groupOpts[Math.max(0, Math.min(groupOpts.length - 1, i + d))]; if (n && n !== activeOpt) { groupSel = String(n.tick); setParam('g', groupSel); applyGrouping(); renderGroupSeg(); } };
// pair popover
let universe = { perp: [], spot: [] }, ctxByCoin = new Map(), tab = 'perp', sel = 0;
const openPair = () => { $('pairpop').classList.add('on'); $('gearpop').classList.remove('on'); $('q').value = ''; sel = 0; renderList(); $('q').focus(); };
const closePair = () => $('pairpop').classList.remove('on');
$('pair').onclick = e => { e.stopPropagation(); $('pairpop').classList.contains('on') ? closePair() : openPair(); };
$('tabs').onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.t === tab)); sel = 0; renderList(); } };
$('q').oninput = () => { sel = 0; renderList(); };
$('q').onkeydown = e => { const rows = visibleRows(); if (e.key === 'ArrowDown') { sel = Math.min(rows.length - 1, sel + 1); renderList(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); renderList(); e.preventDefault(); } else if (e.key === 'Enter') { if (rows[sel]) switchCoin(rows[sel].name); } else if (e.key === 'Escape') closePair(); else if (e.key === 'Tab') { e.preventDefault(); const ts = ['perp', 'spot', 'fav']; tab = ts[(ts.indexOf(tab) + 1) % 3]; [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.t === tab)); sel = 0; renderList(); } };
document.addEventListener('click', e => { if (!e.target.closest('.pop')) { closePair(); $('gearpop').classList.remove('on'); } });
function visibleRows() { const q = $('q').value.trim().toLowerCase(); const src = tab === 'fav' ? [...universe.perp, ...universe.spot].filter(m => favs.has(m.name)) : universe[tab]; return src.filter(m => !q || m.name.toLowerCase().includes(q) || (m.display || '').toLowerCase().includes(q)).slice(0, 200); }
function renderList() { const rows = visibleRows();
  $('list').innerHTML = `<div class="hdr"><span></span><span>market</span><span class="r">price</span><span class="r">24h</span></div>` + rows.map((m, i) => { const c = ctxByCoin.get(m.name), px = c ? +c.markPx : NaN, chg = c && +c.prevDayPx ? (px / +c.prevDayPx - 1) * 100 : NaN;
    return `<div class="row ${i === sel ? 'sel' : ''}" data-n="${m.name}"><span class="star ${favs.has(m.name) ? 'on' : ''}" data-star="${m.name}">★</span><span>${m.display || m.name}${m.name === coin ? ' <span style="color:#60a5fa">●</span>' : ''}</span><span class="r">${isNaN(px) ? '–' : fmtNum(px)}</span><span class="r ${chg >= 0 ? 'up' : 'dn'}">${isNaN(chg) ? '–' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%'}</span></div>`; }).join('');
  $('list').querySelector('.row.sel')?.scrollIntoView({ block: 'nearest' }); }
$('list').onclick = e => { const s = e.target.dataset.star; if (s) { favs.has(s) ? favs.delete(s) : favs.add(s); setPref('favs', [...favs]); renderList(); e.stopPropagation(); return; } const n = e.target.closest('.row')?.dataset.n; if (n) switchCoin(n); };
const fmtNum = v => v >= 1000 ? v.toLocaleString('en-US', { maximumFractionDigits: 1 }) : v >= 1 ? v.toFixed(3) : v.toPrecision(4);
// keyboard
addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === '/') { e.preventDefault(); openPair(); } if (e.key === 'v') { view = view === 'ladder' ? 'spine' : 'ladder'; setParam('view', view === 'ladder' ? '' : view); syncView(); }
  if (e.key === 't') $('trails').click(); if (e.key === 'm') $('mbtn').click(); if (e.key === 'p') $('tape').click(); if (e.key === ' ') { e.preventDefault(); $('pause').click(); }
  if (e.key === '[') stepGroup(-1); if (e.key === ']') stepGroup(1); if (e.key === 'o') $('ovl').click(); if (e.key === 'Escape') { closePair(); $('gearpop').classList.remove('on'); } });

// ───────────── palette ─────────────
const C = { bg: '#0b0e11', text: '#e5e7eb', dim: '#6b7280', bid: [45, 212, 191], ask: [251, 113, 133], hot: [251, 191, 36], mid: [96, 165, 250] };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ───────────── grouping: derived tick options ─────────────
let szDecimals = 5, rawTick = 0.1, gridTick = 1, groupOpts = [], activeOpt = null, lastMag = null;
const CANDIDATES = [{ N: 5 }, { N: 5, m: 2 }, { N: 5, m: 5 }, { N: 4 }, { N: 3 }];
const tickFor = (Pmid, N, m) => Math.max(rawTick, (m || 1) * Math.pow(10, Math.floor(Math.log10(Pmid)) - N + 1));
const fmtTick = t => t >= 1 ? '$' + (t % 1 ? t.toFixed(2) : t) : '$' + t.toFixed(Math.max(1, -Math.floor(Math.log10(t) + 1e-9)));
function deriveGroupOpts(Pmid) {
  const seen = new Map();
  for (const c of CANDIDATES) { const t = +tickFor(Pmid, c.N, c.m).toPrecision(12); if (!seen.has(t)) seen.set(t, { ...c, tick: t, label: fmtTick(t) }); }
  groupOpts = [...seen.values()].sort((a, b) => a.tick - b.tick);
  const want = groupOpts.find(o => String(o.tick) === groupSel) || groupOpts[0];
  return want;                                        // pure: caller decides whether the change means a resubscribe
}
function applyGrouping() { const opt = deriveGroupOpts(lastMid || 1); const changed = !activeOpt || opt.N !== activeOpt.N || opt.m !== activeOpt.m; activeOpt = opt; gridTick = opt.tick; renderGroupSeg(); if (changed) resubscribe(); }

// ───────────── engine (floats; throwaway) ─────────────
const book = { bid: new Map(), ask: new Map() }, hist = new Map(), recent = [], ev = [];
const stat = { slow: 0, fast: 0, bbo: 0, trades: 0, lastSlow: 0, lastFast: 0, state: 'CONNECTING', events: 0, resync: 0, gridChanged: 0, last: null, lastDir: 0, dropped: 0, migrations: 0 };
let version = 0, firstTrades = true, lastMid = 0;
const key = (s, px) => s + ':' + px, now = () => performance.now();
function rec(s, px) { let r = hist.get(key(s, px)); if (!r) { r = { side: s, px, firstSeen: now(), lastChanged: now(), size: 0, shown: new Spring(0), prev: 0, consumed: 0, cancelled: 0, hits: 0, pulses: [], trail: [], F: 0, Ft: now(), watch: null }; hist.set(key(s, px), r); } return r; }
// ── metric layer (ticket 06) ──
const TAU_F = 3000, RES_TRIG = 0.5, RES_TARGET = 0.8, RES_CAP = 30000;
const sideEv = { bid: [], ask: [] }; const pendingDec = [], GRACE = 600;                                   // {t, consumed, cancelled} for 60 s cancelRatio
const migrations = [];                                                 // {side, from, to, t0}
function fieldAdd(r, delta, t) { r.F = r.F * Math.exp(-(t - r.Ft) / TAU_F) + delta; r.Ft = t; }
function fieldNow(r, t) { return r.F * Math.exp(-(t - r.Ft) / TAU_F); }
function onDecrease(r, before, after, consumed, cancelled, t, stream) { if (stream === 'bbo') return;
  const e = { t, consumed, cancelled, hit: consumed > 0 ? 1 : 0, px: r.px, side: r.side, r, prevT: r._prevT, open: true }; sideEv[r.side].push(e); pendingDec.push(e);
  if (!r.watch && before > 0 && (before - after) / before >= RES_TRIG) r.watch = { t0: t, before, done: null, at5: null };
}
function watchTick(r, t) { const w = r.watch; if (!w) return;
  if (w.at5 === null && t - w.t0 >= 5000) w.at5 = r.size / w.before;
  if (w.done === null) { if (r.size >= RES_TARGET * w.before) w.done = t - w.t0; else if (t - w.t0 >= RES_CAP) w.done = Infinity; }
  if (w.done !== null && w.at5 !== null && t - w.t0 > RES_CAP + 5000) r.watch = null;   // record expires after the overlay has had its say
}
function cancelRatio(side, t) { const a = sideEv[side]; while (a.length && a[0].t < t - 60000) a.shift(); let c = 0, x = 0, h = 0; for (const e of a) { c += e.consumed; x += e.cancelled; h += e.hit; } return { vol: c + x > 0 ? x / (c + x) : NaN, cnt: a.length ? 1 - h / a.length : NaN, n: a.length }; }
function execCost(side, Q, mid) { const lv = [...book[side].entries()].sort((p, q) => side === 'bid' ? q[0] - p[0] : p[0] - q[0]); let rem = Q, filled = 0, notl = 0, n = 0;
  for (const [px, l] of lv) { if (rem <= 0) break; const take = Math.min(rem / px, l.sz); filled += take; notl += take * px; rem -= take * px; n++; }
  const vwap = filled ? notl / filled : NaN; return { vwap, bps: filled ? Math.abs(vwap - mid) / mid * 1e4 : NaN, fillFrac: (Q - Math.max(0, rem)) / Q, levels: n, exceeds: rem > 1e-9 }; }
function depthWithin(side, bps, mid) { let s = 0; for (const [px, l] of book[side]) if (Math.abs(px - mid) / mid * 1e4 <= bps) s += l.sz; return s; }
function convexity(side) { const lv = [...book[side].entries()].sort((p, q) => side === 'bid' ? q[0] - p[0] : p[0] - q[0]); if (lv.length < 4) return NaN; const span = Math.abs(lv.at(-1)[0] - lv[0][0]) || 1; let near = 0, tot = 0; for (const [px, l] of lv) { tot += l.sz; if (Math.abs(px - lv[0][0]) <= span * 0.25) near += l.sz; } return tot ? near / tot : NaN; }
function pulse(r, type) { r.pulses.push({ type, t0: now() }); if (r.pulses.length > 6) r.pulses.shift(); stat.events++; ev.push(type); if (ev.length > 200) ev.shift(); }
function tradesAt(side, px, t0, t1) { let v = 0; for (const t of recent) if (t.px === px && t.rx > t0 && t.rx <= t1 && ((side === 'ask') === (t.side === 'B'))) v += t.sz; return v; }
function applyLevels(side, levels, stream, t) {
  const m = book[side], prevT = stream === 'slow' ? stat.lastSlow : stat.lastFast;
  const incoming = new Map(levels.map(l => [+l.px, { sz: +l.sz, n: l.n }]));
  let lo = Infinity, hi = -Infinity; for (const px of incoming.keys()) { lo = Math.min(lo, px); hi = Math.max(hi, px); } const vanishedNow = [], addedNow = [];
  for (const [px, cur] of m) {
    if (!(stream === 'slow' || (px >= lo && px <= hi))) continue;

    $('hud').textContent = `MARKET   ${coin}   group ${activeOpt ? activeOpt.label : '–'} (sig ${activeOpt?.N}${activeOpt?.m ? '×' + activeOpt.m : ''})   raw ${rawTick}\nstate    ${stale ? 'STALE' : stat.state}   resyncs ${stat.resync}   grid changes ${stat.gridChanged}   dropped ${stat.dropped}   pending acks ${pendingAcks.size}\nslow ${stat.slow}  last ${age(stat.lastSlow)}   fast ${stat.fast}  last ${age(stat.lastFast)}\nbbo ${stat.bbo}   trades ${stat.trades}   events ${stat.events}   migrations ${stat.migrations}\nlast events ${ev.slice(-6).join(' ')}\n\nMETRICS  pressure ${S ? S.M.pressure.toFixed(3) : '–'}   cancel% (by count / by vol) bid ${S && !isNaN(S.M.cancelB.cnt) ? Math.round(S.M.cancelB.cnt * 100) + '/' + Math.round(S.M.cancelB.vol * 100) : '–'} ask ${S && !isNaN(S.M.cancelA.cnt) ? Math.round(S.M.cancelA.cnt * 100) + '/' + Math.round(S.M.cancelA.vol * 100) : '–'}\nrefill@5s ${S && !isNaN(S.M.refill5) ? S.M.refill5.toFixed(2) : '–'}   convexity bid ${S && !isNaN(S.M.convB) ? S.M.convB.toFixed(2) : '–'} ask ${S && !isNaN(S.M.convA) ? S.M.convA.toFixed(2) : '–'}   cost ${S ? S.M.costBuy.bps.toFixed(1) + '/' + S.M.costSell.bps.toFixed(1) + ' bps' : '–'}\n\nRENDER   mode ${fpsMode}   fps ${fpsShown.toFixed(1)}   view ${view}   ribbon ${ribbonV}${trailsOn ? '   trails' : ''}${overlaysOn ? '   overlays' : ''}\nframe p50 ${p(0.5)} ms  p95 ${p(0.95)} ms   hist ${hist.size}`; }
}
loop();
</script></body></html>
